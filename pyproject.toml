[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Transforma qualquer imagem (logo, personagem, desenho, foto, pixel art) em SVG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "vtracer>=0.6,<0.7",          # motor de traçado (Rust, MIT)
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "Pillow>=10",
  "scikit-image>=0.22",    # SSIM
  "resvg-py>=0.1",         # rasteriza o SVG para avaliar (Rust, roda no Windows)
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ai = ["rembg[cpu]>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Vitt2909/traceforge"
Issues = "https://github.com/Vitt2909/traceforge/issues"

[project.scripts]
traceforge = "traco.cli:main"
traceforge-web = "traco.web:main"
traco = "traco.cli:main"
traco-web = "traco.web:main"

[tool.setuptools]
packages = ["traco", "traceforge"]

[tool.setuptools.package-data]
traco = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

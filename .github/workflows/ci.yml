name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Install packaged wheel and test CLI outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          if [ "$RUNNER_OS" = "Windows" ]; then
            py="$RUNNER_TEMP/wheel-test/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/wheel-test/bin/python"
          fi
          "$py" -m pip install "$(ls dist/*.whl)[web]"
          cd "$RUNNER_TEMP"
          "$py" -m traceforge --version
          "$py" -c 'from traco.web import index; assert "TraceForge" in index()'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: traceforge-dist
          path: dist/*
